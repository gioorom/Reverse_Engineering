[project]
name = "iec60909"
version = "0.1.0"
description = "Cortocircuito IEC 60909-0:2016, flusso di potenza e arc flash IEEE 1584-2018"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pandapower>=3.0", "arcflash-calc>=0.1"]

[project.scripts]
iec60909 = "iec60909.__main__:main"
iec60909-flusso = "iec60909.flusso:main"
iec60909-arco = "iec60909.arco:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iec60909"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
