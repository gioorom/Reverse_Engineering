[project]
name = "iec60909"
version = "0.1.0"
description = "Calcolo delle correnti di cortocircuito secondo IEC 60909-0:2016"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pandapower>=3.0"]

[project.scripts]
iec60909 = "iec60909.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iec60909"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
